[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "py-container"
dynamic = ["version"]
description = "A composable dependency container with passive UI and service facets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Daniel R. Vásquez Montes", email = "dev.DanielR@gmail.composable" },
]
keywords = ["container", "dependency-injection", "plugin", "registry", "cli", "tui", "gui", "web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "glom>=23.0",
]

[tool.hatch.version]
path = "facetkit/__init__.py"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["facetkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]